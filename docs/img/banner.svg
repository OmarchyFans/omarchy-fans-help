<rect x="742" y="212" width="136" height="30" rx="15" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-width="1.5"/>
<text x="755" y="233" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="15" fill="#a6e3a1" textLength="110" lengthAdjust="spacingAndGlyphs">runs offline</text>
