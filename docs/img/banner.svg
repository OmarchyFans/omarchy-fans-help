<text x="80" y="93" font-family="JetBrainsMono Nerd Font, JetBrains Mono, Fira Code, monospace" font-size="26" fill="#cdd6f4" textLength="372" lengthAdjust="spacingAndGlyphs">how do I change my theme?</text>
<rect x="466" y="66" width="2" height="36" fill="#89b4fa"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
<text x="76" y="144" font-family="monospace" font-size="18" fill="#9aa1b7">⌨</text>
<text x="108" y="144" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="19" fill="#cdd6f4">SUPER + CTRL + SHIFT + L</text>
<text x="676" y="144" text-anchor="end" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="15" fill="#9aa1b7">Omarchy help</text>
<rect x="60" y="162" width="620" height="40" rx="6" fill="#89b4fa" fill-opacity="0.16"/>
<text x="76" y="188" font-family="monospace" font-size="18" fill="#9aa1b7">❯</text>
<text x="108" y="188" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="19" fill="#cdd6f4">omarchy theme set &lt;name&gt;</text>
<text x="676" y="188" text-anchor="end" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="15" fill="#89b4fa">Run · Copy</text>
