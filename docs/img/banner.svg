<rect x="742" y="252" width="173" height="30" rx="15" fill="#cba6f7" fill-opacity="0.16" stroke="#cba6f7" stroke-width="1.5"/>
<text x="755" y="273" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="15" fill="#cba6f7" textLength="147" lengthAdjust="spacingAndGlyphs">reads the manual</text>
