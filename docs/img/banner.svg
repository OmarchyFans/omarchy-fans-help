<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Omarchy Help">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1e2e"/><stop offset="1" stop-color="#171723"/></linearGradient>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#g)"/>
<rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#89b4fa" stroke-opacity="0.35" stroke-width="2"/>
