<text x="108" y="232" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="19" fill="#cdd6f4">Themes</text>
<text x="676" y="232" text-anchor="end" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="15" fill="#9aa1b7">Open manual · Explain</text>
<text x="740" y="104" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="54" font-weight="700" fill="#cdd6f4">Omarchy Help</text>
<text x="742" y="140" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="17" fill="#9aa1b7" textLength="430" lengthAdjust="spacingAndGlyphs">offline help that acts, not just answers</text>
<rect x="742" y="172" width="146" height="30" rx="15" fill="#f38ba8" fill-opacity="0.16" stroke="#f38ba8" stroke-width="1.5"/>
